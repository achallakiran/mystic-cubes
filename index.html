<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2a2858">
<title>Mystic Cubes</title>
<style>
:root{--cream:#f4ead5;--ink:#2d2a5c;--mute:#b9b2d6;--gold:#f0c05a;--deep:#1f1c45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15142e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;color:var(--cream);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif",Georgia,"Times New Roman",serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:390px;height:760px;flex:none;overflow:hidden;transform-origin:center center;background:#2a2858;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 40px 90px rgba(0,0,0,.5)}
#cv{position:absolute;left:0;top:0;width:390px;height:760px;touch-action:none}
.ib{position:absolute;top:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;opacity:.65;transition:opacity .3s;z-index:3}
.ib:hover{opacity:1}
#bhome{left:10px}#bsnd{right:10px}
#stage[data-m=start] #bhome,#stage[data-m=cards] #bhome{display:none}
#saying{position:absolute;left:22px;right:22px;top:58px;text-align:center;line-height:1.95;font-size:15px;opacity:0;transition:opacity .5s;pointer-events:none;min-height:80px}
#stage[data-m=play] #saying,#stage[data-m=tut] #saying,#stage[data-m=done] #saying{opacity:1}
.w{display:inline-block;margin:0 .3em;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.w.a{color:var(--mute);opacity:.8}
.w.g{color:var(--mute);opacity:.62;border-bottom:1px dotted var(--mute)}
.w.b i{display:inline-block;height:0;border-bottom:1.5px solid #8a82b5;vertical-align:-2px;margin-right:1px}
.w.b{color:var(--mute)}
.w.f{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.35);opacity:.2}100%{transform:scale(1);opacity:1}}
#cap{position:absolute;left:30px;right:30px;top:640px;text-align:center;font-size:15px;letter-spacing:.06em;color:var(--cream);opacity:0;transition:opacity .4s;pointer-events:none;line-height:1.6}
#cap.on{opacity:1}
#cap.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}100%{transform:none}}
#finger{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
#finger.on{opacity:1}
#finger .rp{position:absolute;left:-6px;top:-6px;width:52px;height:52px;border-radius:50%;border:2px solid #fff;opacity:0;animation:rp 1.4s ease-out infinite}
@keyframes rp{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
#finger svg{position:absolute;left:0;top:0;animation:tap 1.4s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translate(4px,4px)}40%{transform:translate(0,0)}}
#bar{position:absolute;left:0;right:0;bottom:22px;height:64px;display:none;align-items:center;justify-content:space-between;padding:0 28px;z-index:3}
#stage[data-m=start] #bar,#stage[data-m=play] #bar{display:flex}
.rb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(244,234,213,.35);border-radius:50%;font-size:16px;opacity:.8}
.rb:hover{opacity:1}
#bhint{position:relative;width:60px;height:60px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);background:rgba(31,28,69,.55)}
#stage[data-m=start] #bhint{visibility:hidden}
#hn{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:12px;line-height:20px;text-align:center}
#bhint.zero{opacity:.45}
#bhint.pulse{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(240,192,90,.0)}50%{box-shadow:0 0 0 9px rgba(240,192,90,.28)}}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .55s;z-index:4}
.scr.on{opacity:1}
.scr.on button,.scr.on .pnl,.scr.on .cd,.scr.on #cgrid{pointer-events:auto}
#start h1{position:absolute;top:78px;left:0;right:0;margin:0;text-align:center;font-weight:400;font-size:23px;letter-spacing:.42em;text-indent:.42em}
#start .sub{position:absolute;top:118px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.3em;text-indent:.3em;color:var(--mute)}
#bplay{position:absolute;left:50%;bottom:116px;margin-left:-38px;width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(240,192,90,.2)}
#plbl{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:12px;letter-spacing:.3em;text-indent:.3em;color:var(--mute)}
#bnew{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:12px;letter-spacing:.2em;color:var(--mute);text-decoration:underline;display:none}
#tier .ttl,#pickcap .ttl{position:absolute;top:96px;left:0;right:0;text-align:center;font-size:14px;letter-spacing:.34em;text-indent:.34em;color:var(--mute)}
.tr{position:absolute;left:36px;right:36px;height:92px;border-radius:14px;background:rgba(244,234,213,.09);border:1px solid rgba(244,234,213,.22);display:flex;flex-direction:column;justify-content:center;padding:0 22px;text-align:left;transition:background .3s}
.tr:hover{background:rgba(244,234,213,.18)}
.tr b{font-weight:400;font-size:20px;letter-spacing:.3em}
.tr span{font-size:12px;letter-spacing:.14em;color:var(--mute);margin-top:6px}
#pickcap .ttl{top:150px}
.pnl{position:absolute;background:var(--cream);color:var(--ink);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#done .pnl{left:28px;right:28px;top:150px;padding:30px 24px 24px;text-align:center}
#done .tag{font-size:11px;letter-spacing:.3em;text-indent:.3em;color:#7a6fa8;text-transform:uppercase}
#done .sy{font-size:22px;line-height:1.5;margin:18px 0 10px}
#done .by{font-size:13px;color:#6a6490;letter-spacing:.06em;margin-bottom:24px}
.btn{display:inline-block;padding:11px 20px;border-radius:22px;font-size:13px;letter-spacing:.18em;margin:4px}
.btn.p{background:var(--ink);color:var(--cream)}
.btn.s{border:1px solid var(--ink);color:var(--ink)}
#cards{background:#1f1c45;z-index:5}
#cards .hd{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.34em;text-indent:.34em;color:var(--mute)}
#cards .cx{position:absolute;top:12px;right:10px;width:44px;height:44px;font-size:22px;color:var(--mute)}
#cgrid{position:absolute;top:70px;left:0;right:0;bottom:0;padding:6px 22px 30px;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
.cd{height:128px;border-radius:10px;background:#352f6b;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd .bd{position:absolute;top:0;left:0;right:0;height:9px}
.cd.l{background:none;border:1.5px dashed #5b548f;color:#5b548f;font-size:22px}
.cd small{position:absolute;bottom:8px;font-size:10px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
#detail{z-index:6;background:rgba(15,14,36,.72)}
#detail .pnl{left:28px;right:28px;top:190px;padding:28px 22px 20px;text-align:center}
#detail .sy{font-size:20px;line-height:1.5;margin:10px 0}
#detail .by{font-size:13px;color:#6a6490;margin-bottom:18px}
</style>
</head>
<body>
<div id="wrap">
<div id="stage" data-m="start">
  <canvas id="cv"></canvas>
  <div id="saying"></div>
  <button class="ib" id="bhome" aria-label="home"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#f4ead5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 5 L7.5 11 L13.5 17"/></svg></button>
  <button class="ib" id="bsnd" aria-label="sound"><svg id="isnd" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#f4ead5" stroke-width="1.4"></svg></button>
  <div id="finger"><span class="rp"></span><svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="8" fill="#fff" opacity=".92"/><rect x="17" y="22" width="9" height="20" rx="4.5" transform="rotate(-25 20 22)" fill="#fff" opacity=".92"/></svg></div>
  <div id="cap"></div>
  <div id="bar">
    <button class="rb" id="bcards" aria-label="cards"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#f4ead5" stroke-width="1.3"><rect x="3" y="4" width="10" height="13" rx="2"/><path d="M15 6 L17 16"/></svg></button>
    <button id="bhint" aria-label="hint"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13 3 V5 M13 21 V23 M4 13 H6 M20 13 H22"/><circle cx="13" cy="13" r="4.5"/></svg><span id="hn">2</span></button>
    <button class="rb" id="bhelp" aria-label="tutorial">?</button>
  </div>
  <div class="scr" id="start">
    <h1>MYSTIC CUBES</h1><div class="sub">a saying in every cube</div>
    <button id="bplay" aria-label="play"><svg width="30" height="30" viewBox="0 0 30 30"><polygon points="10,6 10,24 24,15" fill="#2d2a5c"/></svg></button>
    <div id="plbl">PLAY</div><button id="bnew">new cube</button>
  </div>
  <div class="scr" id="tier"><div class="ttl">CHOOSE YOUR PATH</div></div>
  <div class="scr" id="pickcap"><div class="ttl" id="ptxt">TOUCH A CUBE</div></div>
  <div class="scr" id="done"><div class="pnl"><div class="tag" id="dtag"></div><div class="sy" id="dsy"></div><div class="by" id="dby"></div><button class="btn p" id="dnext">ANOTHER CUBE</button><button class="btn s" id="dcards">CARDS</button></div></div>
  <div class="scr" id="cards"><div class="hd" id="chd"></div><button class="cx" id="ccls" aria-label="close">&times;</button><div id="cgrid"></div></div>
  <div class="scr" id="detail"><div class="pnl"><div class="tag" id="xtag" style="font-size:11px;letter-spacing:.3em;color:#7a6fa8;text-transform:uppercase"></div><div class="sy" id="xsy"></div><div class="by" id="xby"></div><button class="btn p" id="xplay">PLAY AGAIN</button><button class="btn s" id="xcls">CLOSE</button></div></div>
</div>
</div>
<script src="js/core.js"></script>
<script src="js/sayings.js"></script>
<script src="js/gen.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
